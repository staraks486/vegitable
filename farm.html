
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WJ's Farmer's Gate - Inventory</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Hide scrollbar for horizontal scrolling tabs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
    <div class="w-full px-3 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="bg-emerald-600 p-1.5 rounded-md text-white shadow-sm"><i data-lucide="store" class="w-4 h-4"></i></div>
        <div class="hidden sm:block">
          <h1 class="text-sm font-black text-slate-900 leading-none">Inventory</h1>
          <div class="flex items-center gap-1 mt-0.5">
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Farmer's Gate • <span id="header-count">0</span> Items</p>
          </div>
        </div>
      </div>
      <div class="relative w-full max-w-sm">
        <i data-lucide="search" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 w-3.5 h-3.5"></i>
        <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()" class="w-full rounded-md bg-slate-100 border border-slate-200 py-1.5 pl-8 pr-3 text-xs font-medium focus:ring-1 focus:ring-emerald-500 outline-none transition-all" />
      </div>
    </div>
  </header>

  <main class="w-full px-2 pt-3">
    <!-- Controls -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3 bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
      <div class="flex gap-1.5 w-full sm:w-auto">
        <button onclick="openModal()" class="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md text-xs font-bold transition-all active:scale-95"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Item</button>
        <button onclick="shareWhatsApp()" class="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-md text-xs font-bold transition-all active:scale-95"><i data-lucide="share-2" class="w-3.5 h-3.5"></i> Share</button>
      </div>
      <div class="flex gap-1.5 w-full sm:w-auto">
        <button onclick="exportCSV()" class="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-md text-xs font-bold transition-all"><i data-lucide="download" class="w-3.5 h-3.5"></i> Export</button>
        <button onclick="document.getElementById('fileInput').click()" class="flex-1 sm:flex-none flex items-center justify-center gap-1 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-md text-xs font-bold transition-all"><i data-lucide="upload" class="w-3.5 h-3.5"></i> Import</button>
        <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="importCSV(event)" />
      </div>
    </div>

    <!-- Tabs -->
    <div id="tabsContainer" class="mb-3 flex overflow-x-auto gap-1 pb-1 scroll-smooth no-scrollbar">
      <!-- Tabs injected by JS -->
    </div>

    <!-- Grid -->
    <div id="gridContainer" class="grid grid-cols-2 min-[480px]:grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-2">
      <!-- Cards injected by JS -->
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="productModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between p-3 border-b border-slate-100 bg-slate-50 shrink-0">
        <h2 id="modalTitle" class="text-sm font-bold text-slate-800">Add New Product</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-slate-200/50 hover:bg-slate-200 p-1 rounded-full transition-all"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      
      <div class="p-4 overflow-y-auto space-y-3">
        <input type="hidden" id="formId" />
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Category</label>
          <input type="text" id="formCategory" list="categories-list" placeholder="Select or type new..." class="w-full px-3 py-1.5 rounded-lg border border-slate-200 focus:border-emerald-500 outline-none text-sm font-medium" />
          <datalist id="categories-list"></datalist>
        </div>

        <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-2.5 space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Product Name</label>
            <button onclick="autoTranslate()" id="translateBtn" class="text-[10px] text-emerald-700 bg-emerald-100 hover:bg-emerald-200 px-2 py-0.5 rounded font-bold flex items-center gap-1 transition-colors">
              <i data-lucide="wand-2" class="w-3 h-3"></i> <span id="translateText">Auto-Translate</span>
            </button>
          </div>
          <input type="text" id="formNameEn" placeholder="English (e.g. Apple)" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 outline-none text-sm font-medium" />
          <div class="flex gap-2">
            <input type="text" id="formNamePa" placeholder="Punjabi" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 outline-none text-sm font-medium" />
            <input type="text" id="formNameHi" placeholder="Hindi" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 outline-none text-sm font-medium" />
          </div>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Price (₹)</label>
            <input type="number" id="formPrice" placeholder="0" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 focus:border-emerald-500 outline-none text-sm font-bold" />
          </div>
          <div class="flex-1">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Unit</label>
            <input type="text" id="formUnit" list="unit-options" placeholder="e.g. kg, pkt" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 focus:border-emerald-500 outline-none text-sm font-bold" />
            <datalist id="unit-options">
              <option value="kg"></option><option value="500g"></option><option value="250g"></option>
              <option value="liter"></option><option value="pkt"></option><option value="pcs"></option>
              <option value="Dozen"></option><option value="Box"></option>
            </datalist>
          </div>
        </div>
      </div>

      <div class="p-3 border-t border-slate-100 bg-slate-50 shrink-0">
        <button onclick="saveProduct()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700 shadow-sm transition-all">
          Save Product
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- Initial Data & State ---
    const INITIAL_DATA = [
      { id: 1, cat: "Pulses, Millets, Spices", name: "Kidney Beans / ਰਾਜਮਾਂਹ / राजमा", price: 120, unit: "500g", available: true },
      { id: 2, cat: "Vegetables", name: "Onion / ਪਿਆਜ਼ / प्याज", price: 30, unit: "kg", available: true },
      { id: 3, cat: "Fruits", name: "Happy Banana / ਕੇਲਾ / केला", price: 90, unit: "Dozen", available: true },
    ];

    let products = [];
    let activeTab = 'All';
    let searchTerm = '';

    // --- Load Data ---
    function init() {
      try {
        const saved = localStorage.getItem('wj_farmers_gate_vanilla');
        products = saved ? JSON.parse(saved) : INITIAL_DATA;
      } catch (e) {
        products = INITIAL_DATA;
      }
      renderApp();
    }

    function saveToLocal() {
      localStorage.setItem('wj_farmers_gate_vanilla', JSON.stringify(products));
      document.getElementById('header-count').innerText = products.length;
    }

    // --- Core Rendering ---
    function renderApp() {
      saveToLocal();
      renderTabs();
      renderGrid();
    }

    function renderTabs() {
      const categories = [...new Set(products.map(p => p.cat))].sort((a, b) => a.localeCompare(b));
      const tabsContainer = document.getElementById('tabsContainer');
      const datalist = document.getElementById('categories-list');
      
      datalist.innerHTML = categories.map(c => `<option value="${c}"></option>`).join('');

      let html = `<button onclick="setTab('All')" class="whitespace-nowrap px-3 py-1 rounded-md text-xs font-bold transition-all ${activeTab === 'All' ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}">All (${products.length})</button>`;
      
      categories.forEach(cat => {
        const count = products.filter(p => p.cat === cat).length;
        html += `<button onclick="setTab('${cat}')" class="whitespace-nowrap px-3 py-1 rounded-md text-xs font-bold transition-all ${activeTab === cat ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}">${cat} (${count})</button>`;
      });
      tabsContainer.innerHTML = html;
    }

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      const filtered = products.filter(p => 
        (activeTab === 'All' || p.cat === activeTab) &&
        (p.name.toLowerCase().includes(searchTerm) || p.cat.toLowerCase().includes(searchTerm))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-400"><i data-lucide="package-search" class="w-8 h-8 mb-2 text-slate-300"></i><p class="text-sm font-bold text-slate-500">No products found</p></div>`;
      } else {
        container.innerHTML = filtered.map(p => `
          <div class="bg-white rounded-lg p-2 shadow-sm border border-slate-200 flex flex-col hover:shadow-md hover:border-emerald-300 transition-all relative group">
            <div class="absolute top-1 right-1 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity z-10">
              <button onclick="openModal(${p.id})" class="text-slate-400 hover:text-blue-500 p-1 bg-white rounded-md shadow-[0_2px_4px_rgba(0,0,0,0.05)]"><i data-lucide="edit" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteItem(${p.id})" class="text-slate-400 hover:text-red-500 p-1 bg-white rounded-md shadow-[0_2px_4px_rgba(0,0,0,0.05)]"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
            <div class="pr-10 mb-1.5 flex-1">
              <h3 class="text-xs font-bold text-slate-800 leading-tight line-clamp-2">${p.name}</h3>
            </div>
            <div class="flex flex-col gap-1.5 mt-auto">
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded px-1.5 py-1 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
                <span class="text-slate-400 font-bold text-[10px]">₹</span>
                <input type="number" value="${p.price}" onchange="updateItem(${p.id}, 'price', this.value)" class="w-10 bg-transparent text-xs font-bold text-slate-800 outline-none" />
                <span class="text-slate-300 text-[10px]">/</span>
                <input type="text" list="unit-options" value="${p.unit}" onchange="updateItem(${p.id}, 'unit', this.value)" class="w-full bg-transparent text-[11px] font-semibold text-slate-600 outline-none" />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[8px] font-black uppercase tracking-wider ${p.available ? 'text-emerald-500' : 'text-red-400'}">${p.available ? 'In Stock' : 'Out'}</span>
                <button onclick="toggleStock(${p.id})" class="flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold transition-colors ${p.available ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
                  ${p.available ? '<i data-lucide="x" class="w-2.5 h-2.5"></i> Mark Out' : '<i data-lucide="check" class="w-2.5 h-2.5"></i> Mark In'}
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons(); // Refresh icons
    }

    // --- Handlers ---
    function setTab(tab) { activeTab = tab; renderTabs(); renderGrid(); }
    function handleSearch() { searchTerm = document.getElementById('searchInput').value.toLowerCase(); renderGrid(); }
    
    function updateItem(id, field, val) {
      const idx = products.findIndex(p => p.id === id);
      if(idx > -1) {
        products[idx][field] = field === 'price' ? Number(val) : val;
        saveToLocal();
      }
    }
    function toggleStock(id) {
      const idx = products.findIndex(p => p.id === id);
      if(idx > -1) { products[idx].available = !products[idx].available; renderApp(); }
    }
    function deleteItem(id) {
      if(confirm("Delete this item permanently?")) {
        products = products.filter(p => p.id !== id); renderApp();
      }
    }

    // --- Modal Logic ---
    function openModal(id = null) {
      document.getElementById('productModal').classList.remove('hidden');
      if(id) {
        const p = products.find(x => x.id === id);
        const names = p.name.split(' / ');
        document.getElementById('modalTitle').innerText = 'Edit Product';
        document.getElementById('formId').value = p.id;
        document.getElementById('formCategory').value = p.cat;
        document.getElementById('formNameEn').value = names[0]?.trim() || '';
        document.getElementById('formNamePa').value = names[1]?.trim() || '';
        document.getElementById('formNameHi').value = names[2]?.trim() || '';
        document.getElementById('formPrice').value = p.price;
        document.getElementById('formUnit').value = p.unit;
      } else {
        document.getElementById('modalTitle').innerText = 'Add Product';
        document.getElementById('formId').value = '';
        document.getElementById('formCategory').value = activeTab !== 'All' ? activeTab : '';
        document.getElementById('formNameEn').value = '';
        document.getElementById('formNamePa').value = '';
        document.getElementById('formNameHi').value = '';
        document.getElementById('formPrice').value = '';
        document.getElementById('formUnit').value = '';
      }
    }

    function closeModal() { document.getElementById('productModal').classList.add('hidden'); }

    function saveProduct() {
      const id = document.getElementById('formId').value;
      const cat = document.getElementById('formCategory').value || 'Uncategorized';
      const en = document.getElementById('formNameEn').value;
      const pa = document.getElementById('formNamePa').value;
      const hi = document.getElementById('formNameHi').value;
      const price = document.getElementById('formPrice').value;
      const unit = document.getElementById('formUnit').value;

      if(!en || !price || !unit) return alert("English Name, Price, and Unit are required!");

      const name = [en, pa, hi].filter(Boolean).join(' / ');
      const newProd = { id: id ? Number(id) : Date.now(), cat, name, price: Number(price), unit, available: true };

      if(id) {
        const idx = products.findIndex(p => p.id == id);
        newProd.available = products[idx].available;
        products[idx] = newProd;
      } else {
        products.push(newProd);
      }
      closeModal(); renderApp();
    }

    async function autoTranslate() {
      const en = document.getElementById('formNameEn').value;
      if(!en) return;
      const btnTxt = document.getElementById('translateText');
      btnTxt.innerText = "Translating...";
      try {
        const [resPa, resHi] = await Promise.all([
          fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|pa`),
          fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|hi`)
        ]);
        const dataPa = await resPa.json(); const dataHi = await resHi.json();
        if(dataPa.responseData?.translatedText) document.getElementById('formNamePa').value = dataPa.responseData.translatedText;
        if(dataHi.responseData?.translatedText) document.getElementById('formNameHi').value = dataHi.responseData.translatedText;
      } catch(e) { console.error(e); }
      btnTxt.innerText = "Auto-Translate";
    }

    // --- Sharing & CSV ---
    function shareWhatsApp() {
      const avail = products.filter(p => p.available);
      let text = `*WJ’s Farmer’s Gate*\nPesticide Free Vegetables, Fruits, Pulses & Dairy.\n*Call:* 95010-33547\n\n*Rate List: ${new Date().toLocaleDateString('en-GB')}*\n*Total Items Available: ${avail.length}*\n\n`;
      const categories = [...new Set(avail.map(p => p.cat))].sort((a, b) => a.localeCompare(b));
      categories.forEach(cat => {
        const catItems = avail.filter(p => p.cat === cat).sort((a, b) => a.name.localeCompare(b.name));
        if(catItems.length) {
          text += `*--- ${cat.toUpperCase()} ---*\n` + catItems.map(p => `• ${p.name} - ₹${p.price}/${p.unit}`).join('\n') + `\n\n`;
        }
      });
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function exportCSV() {
      if(!products.length) return;
      const keys = Object.keys(products[0]);
      const csv = [keys.join(','), ...products.map(p => keys.map(k => `"${String(p[k]).replace(/"/g, '""')}"`).join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `inventory-${new Date().toISOString().split('T')[0]}.csv`;
      link.click(); URL.revokeObjectURL(url);
    }

    function importCSV(e) {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if(lines.length < 2) return alert("Invalid file");
        const headers = lines[0].split(',').map(h => h.replace(/"/g, ''));
        const newProducts = [];
        for(let i=1; i<lines.length; i++) {
          const vals = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g)?.map(v => v.replace(/^"|"$/g, '')) || lines[i].split(',');
          let obj = {};
          headers.forEach((h, j) => {
            let v = vals[j] || '';
            if(h === 'id' || h === 'price') v = Number(v);
            if(h === 'available') v = v.toString().toLowerCase() === 'true';
            obj[h] = v;
          });
          if(obj.name) newProducts.push(obj);
        }
        if(newProducts.length) { products = newProducts; renderApp(); alert("Imported Successfully!"); }
      };
      reader.readAsText(file); e.target.value = '';
    }

    // Startup
    init();
  </script>
</body>
</html>
